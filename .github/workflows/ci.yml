name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,         os: ubuntu-latest, cc: gcc,   cxx: g++, cmake_args: "-DUSE_OPENMP=ON" }
          - { name: linux-clang,       os: ubuntu-latest, cc: clang, cxx: clang++, cmake_args: "-DUSE_OPENMP=OFF" }
          - { name: linux-no-openmp,   os: ubuntu-latest, cc: gcc,   cxx: g++, cmake_args: "-DUSE_OPENMP=OFF" }
          - { name: macos-apple-clang, os: macos-latest, cmake_args: "-DUSE_OPENMP=ON" }
          - { name: windows-msvc,      os: windows-latest, cmake_args: "-DUSE_OPENMP=OFF" }
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      OMP_WAIT_POLICY: PASSIVE
      KMP_BLOCKTIME: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Python dependencies
        run: pip install -r requirements-test.txt cmake build
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_NATIVE=OFF -DMIXDEX_BUILD_TESTS=ON \
                -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300
      - name: Python tests
        run: |
          export MIXDEX_BUILD_DIR=build
          python -m pytest -q
      - name: Installed C++ consumer
        run: |
          cmake --install build --config Release --prefix "$PWD/installed-cpp" --component CppDevelopment
          cmake -S tests/install -B consumer -DCMAKE_PREFIX_PATH="$PWD/installed-cpp"
          cmake --build consumer --config Release -j 4
          ctest --test-dir consumer -C Release --output-on-failure
      - name: Build wheel from source archive
        run: python -m build
      - name: Installed wheel smoke test
        run: |
          python -m pip install --no-deps --target installed-python dist/*.whl
          PYTHONPATH="$PWD/installed-python" python tests/install/wheel_smoke.py

  # C++ ThreadSanitizer checks use Clang, libomp and Archer; Python is not instrumented.
  tsan:
    name: linux-clang-tsan
    runs-on: ubuntu-24.04
    env:
      CC: clang-19
      CXX: clang++-19
      OMP_WAIT_POLICY: PASSIVE
      KMP_BLOCKTIME: "0"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-19 llvm-19 libclang-rt-19-dev cmake curl xz-utils python3
      - name: OpenMP runtime for ThreadSanitizer
        run: |
          runtime_dir="$RUNNER_TEMP/mixdex-tsan-openmp"
          bash .github/scripts/build_tsan_openmp.sh "$runtime_dir"
          echo "MIXDEX_TSAN_OPENMP_ROOT=$runtime_dir/install" >> "$GITHUB_ENV"
      - name: Configure and build
        run: |
          cmake -S . -B build-tsan -DMIXDEX_BUILD_PYTHON=OFF -DUSE_OPENMP=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_NATIVE=OFF -DMIXDEX_BUILD_TESTS=ON \
                -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1 -g" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
                -DOpenMP_CXX_FLAGS="-fopenmp -I$MIXDEX_TSAN_OPENMP_ROOT/include" \
                -DOpenMP_CXX_LIB_NAMES=omp \
                -DOpenMP_omp_LIBRARY="$MIXDEX_TSAN_OPENMP_ROOT/lib/libomp.so" \
                -DCMAKE_BUILD_RPATH="$MIXDEX_TSAN_OPENMP_ROOT/lib"
          cmake --build build-tsan -j 4
          "$CXX" -std=c++20 -O1 -g -pthread -fsanitize=thread -fopenmp \
                -I"$MIXDEX_TSAN_OPENMP_ROOT/include" \
                tests/sanitizers/openmp_runtime_probe.cpp \
                -L"$MIXDEX_TSAN_OPENMP_ROOT/lib" \
                -Wl,-rpath,"$MIXDEX_TSAN_OPENMP_ROOT/lib" \
                -o build-tsan/openmp_runtime_probe
      - name: Check detector and run C++ tests
        run: |
          export OMP_NUM_THREADS=4
          export OMP_TOOL_LIBRARIES="$MIXDEX_TSAN_OPENMP_ROOT/lib/libarcher.so"
          export ARCHER_OPTIONS=verbose=1
          export TSAN_OPTIONS="ignore_noninstrumented_modules=1:halt_on_error=1:exitcode=66:external_symbolizer_path=/usr/bin/llvm-symbolizer-19"
          timeout 60s build-tsan/openmp_runtime_probe
          for mode in --thread-race --race; do
            log="build-tsan/expected-${mode#--}.log"
            status=0
            timeout 60s build-tsan/openmp_runtime_probe "$mode" > "$log" 2>&1 || status=$?
            if [ "$status" -ne 66 ] || \
               ! grep -q 'WARNING: ThreadSanitizer: data race' "$log" || \
               ! grep -q 'race_write' "$log"; then
              cat "$log"
              echo "Control $mode exited with $status; expected 66 and a race_write report"
              exit 1
            fi
            echo "Intentional race detected as expected: $mode"
          done
          ctest --test-dir build-tsan --output-on-failure --timeout 600
